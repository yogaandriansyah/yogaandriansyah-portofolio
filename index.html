$("#links").innerHTML=nav.map(n=>`<a href="#${n[0]}" data-s>${n[1]}</a>`).join("")+cvBtn("sm p");
const head=(e,t,s)=>`<div class="eyebrow">${e}</div><h2>${t}</h2>${s?`<p class="sub">${s}</p>`:""}`;
const tags=a=>`<div class="tags">${a.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`;
const ul=a=>`<ul>${a.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;

$("#main").innerHTML=`
<section class="hero" id="home"><div class="wrap hg"><div class="rv">
<div class="eyebrow">Professional Portfolio · Bekasi, West Java</div><h1>${esc(C.name)}</h1><div class="hl">${esc(C.headline)}</div><p>${esc(C.intro)}</p>
<div class="cta"><a class="btn p" href="#projects" data-s>View My Projects</a>${cvBtn()}<a class="btn" href="#contact" data-s>Contact Me</a></div></div>
<div class="ph rv">${C.photo?`<img src="${esc(C.photo)}" alt="Photo of ${esc(C.name)}" loading="eager">`:`<div>Profile photo placeholder<br><small>Set <code>photo</code> in CONFIG</small></div>`}</div></div></section>
<section id="about"><div class="wrap rv">${head("About","About Me")}<div class="card">${C.about.map(p=>`<p style="margin:0 0 14px">${esc(p)}</p>`).join("")}</div>
<div class="grid g4" style="margin-top:18px">${C.highlights.map(h=>`<div class="card stat"><b>${h[0]}</b><span>${h[1]}</span></div>`).join("")}</div>
<p class="note">Professional experience highlights based on my roles, not independently audited metrics.</p></div></section>
<section id="skills"><div class="wrap rv">${head("Skills","Skills & Expertise","Grouped by area of work, without proficiency percentages.")}
<div class="grid g2">${Object.entries(C.skills).map(([k,v])=>`<div class="card"><h3>${esc(k)}</h3>${tags(v)}</div>`).join("")}</div></div></section>
<section id="experience"><div class="wrap rv">${head("Experience","Work Experience")}<div class="tl">${C.experience.map(e=>`<div class="card"><div class="per">${esc(e.period)}</div><h3>${esc(e.role)}</h3><div style="color:var(--mut)">${esc(e.org)}</div>${ul(e.items)}</div>`).join("")}</div></div></section>
<section id="projects"><div class="wrap rv">${head("Projects","Featured Projects","Links, screenshots, and repositories appear once added in CONFIG.")}
<div class="grid g3">${C.projects.map(p=>`<div class="card"><span class="badge">${esc(p.badge)}</span><h3>${esc(p.title)}</h3><div class="shot">${esc(p.shot)}</div><p style="color:var(--mut);margin:0 0 8px">${esc(p.desc)}</p><div class="per" style="font-size:13px">${esc(p.meta)}</div>${tags(p.tech)}${ul(p.pts)}
<div class="cta" style="margin-top:16px">${p.demo?`<a class="btn sm" href="${esc(p.demo)}" target="_blank" rel="noopener">Demo</a>`:""}${p.repo?`<a class="btn sm" href="${esc(p.repo)}" target="_blank" rel="noopener">Repository</a>`:""}</div></div>`).join("")}</div></div></section>
<section id="certs"><div class="wrap rv">${head("Credentials","Certifications & Training","Certificate images and credential links appear once added in CONFIG.")}
<div class="grid g4">${C.certs.map(c=>`<div class="card cert"><div class="shot">${c.image?`<img src="${esc(c.image)}" alt="Certificate: ${esc(c.name)}" loading="lazy" style="max-height:100%;max-width:100%">`:"Certificate placeholder"}</div><h3>${esc(c.name)}</h3><small>${esc(c.org)} · ${esc(c.year)}</small>${c.url?`<div><a href="${esc(c.url)}" target="_blank" rel="noopener" style="color:var(--ac);font-size:14px">View credential</a></div>`:""}</div>`).join("")}</div>
<div class="grid g2" style="margin-top:28px"><div class="card"><div class="eyebrow">Education</div>${C.education.map((e,i)=>`<div style="${i?"margin-top:18px":""}"><h3>${esc(e.degree)}</h3><div class="per" style="font-size:14px">${esc(e.org)} · ${esc(e.period)}</div>${e.note?`<p class="note" style="margin-top:4px">${esc(e.note)}</p>`:""}</div>`).join("")}</div>
<div class="card"><div class="eyebrow">Organization</div><h3>${esc(C.organization.role)}</h3><div class="per">${esc(C.organization.name)} · ${esc(C.organization.period)}</div>${ul(C.organization.items)}</div></div></div></section>
<section id="contact"><div class="wrap rv ct">${head("Contact","Let’s Connect","Open to opportunities in IT Support, Application Support, IT Infrastructure, and related roles. Feel free to reach out.")}
<div class="card" style="max-width:560px"><a class="row" href="${mail}"><span>✉️</span><div><small>Email</small>${esc(C.email)}</div></a>
<a class="row" href="${wa}" target="_blank" rel="noopener"><span>💬</span><div><small>WhatsApp</small>${esc(C.whatsappDisplay)}</div></a>
<a class="row" href="${esc(C.linkedin)}" target="_blank" rel="noopener"><span>🔗</span><div><small>LinkedIn</small>linkedin.com/in/yogaandriansyah</div></a>
<div class="cta">${cvBtn("p")}</div></div></div></section>`;

$("#foot").innerHTML=`<div><b style="color:var(--tx)">${esc(C.name)}</b><br>Building reliable, user-friendly IT solutions.<br>© ${new Date().getFullYear()} ${esc(C.name)}</div>
<div>${nav.map(n=>`<a href="#${n[0]}" data-s>${n[1]}</a>`).join("")}</div>
<div><a href="${mail}">Email</a><a href="${wa}" target="_blank" rel="noopener">WhatsApp</a><a href="${esc(C.linkedin)}" target="_blank" rel="noopener">LinkedIn</a></div>`;

let DL=null;
(async()=>{try{DL=window.claude?await window.claude.use("downloads"):null}catch(e){}
 if(!DL)document.querySelectorAll("[data-cv]").forEach(a=>a.textContent="Request CV")})();
document.addEventListener("click",async e=>{const a=e.target.closest("[data-cv]");if(!a||!DL)return;e.preventDefault();
 try{const s=atob(CV_B64),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);
 await DL.save({filename:C.cvFile,data:new Blob([u],{type:"application/pdf"})})}catch(x){}});
const links=$("#links"),menu=$("#menu");
menu.onclick=()=>{const o=links.classList.toggle("open");menu.setAttribute("aria-expanded",o)};
document.addEventListener("click",e=>{const a=e.target.closest("a[data-s],.links a[href^='#']");if(!a)return;
 const t=document.getElementById(a.getAttribute("href").slice(1));if(!t)return;e.preventDefault();
 t.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});links.classList.remove("open");menu.setAttribute("aria-expanded","false")});
try{const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.08});
document.querySelectorAll(".rv").forEach(el=>io.observe(el));
const secs=nav.map(n=>document.getElementById(n[0])),so=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)document.querySelectorAll(".links a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+x.target.id))}),{rootMargin:"-40% 0px -55% 0px"});
secs.forEach(s=>s&&so.observe(s))}catch(e){document.querySelectorAll(".rv").forEach(el=>el.classList.add("in"))}
</script>
</body>
</html>
